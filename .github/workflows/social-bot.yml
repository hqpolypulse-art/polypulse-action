name: PolyPulse Autonomous Agent Workflow

on:
  schedule:
    - cron: '0 12 * * *' # تشغيل تلقائي يومياً الساعة 12 ظهراً
  workflow_dispatch: # إمكانية التشغيل اليدوي بضغطة زر

jobs:
  agent_run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Autonomous Agent
        run: |
          python scripts/social_agent.py

      - name: Upload Daily Report Artifact
        uses: actions/upload-artifact@v4
        with:
          name: daily-pulse-report
          path: output/daily_report.md
